name: Apply First-Turn Fix
on:
  push:
    branches: [agent/fix-first-turn-startup]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-first-turn-startup
      - name: Cachebust and add first-turn smoke coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='assets/student-handsfree.js?v=20260816-conversation2'
          new='assets/student-handsfree.js?v=20260816-conversation3'
          if old not in s:
              raise SystemExit('hands-free conversation2 asset tag not found')
          p.write_text(s.replace(old,new,1))

          p=Path('tools/smoke-launch-readiness.mjs')
          s=p.read_text()
          anchor="    if(!hf.hasManualMic)throw new Error(`${name}: push-to-talk fallback is missing`);\n"
          addition=r'''

    // First-turn startup must ignore microphone settling and must not grade a simple greeting.
    const firstTurn=await page.evaluate(async()=>{
      const warmup=HANDSFREE.firstTurnWarmupMs;
      const minVoiced=HANDSFREE.firstTurnMinVoicedMs;
      const originalSpeak=window.speak;
      window.speak=async()=>{};
      APP.selectedScenario='elevator';
      APP.selectedBuyer='marcus';
      APP.history=[];
      APP.transcript=[];
      APP.scores={};
      document.getElementById('chat').innerHTML='';
      document.getElementById('overall-score').textContent='—';
      document.getElementById('chat-input').value='Hello';
      await window.sendMessage();
      const coachCount=document.querySelectorAll('#chat .msg.coach').length;
      const buyerText=document.querySelector('#chat .msg:not(.student):last-child .bubble')?.textContent||'';
      const overall=document.getElementById('overall-score').textContent;
      const turns=APP.history.filter(x=>x.role==='user').length;
      window.speak=originalSpeak;
      return {warmup,minVoiced,coachCount,buyerText,overall,turns};
    });
    if(firstTurn.warmup<500)throw new Error(`${name}: first-turn microphone warm-up is too short`);
    if(firstTurn.minVoiced<150)throw new Error(`${name}: first-turn noise rejection is too permissive`);
    if(firstTurn.coachCount!==0||firstTurn.overall!=='—')throw new Error(`${name}: a greeting was incorrectly graded as a sales turn`);
    if(firstTurn.turns!==1||!firstTurn.buyerText.toLowerCase().includes('go ahead'))throw new Error(`${name}: greeting did not receive a natural continuation`);
'''
          if anchor not in s:
              raise SystemExit('smoke insertion anchor not found')
          p.write_text(s.replace(anchor,anchor+addition,1))
          PY
      - name: Commit final feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/smoke-launch-readiness.mjs
          git commit -m "Cachebust and test first-turn startup"
          git push origin HEAD:agent/fix-first-turn-startup
