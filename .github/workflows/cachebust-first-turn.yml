name: Cachebust First Turn
on:
  push:
    branches:
      - agent/fix-first-turn-startup
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-first-turn-startup
      - name: Bump student hands-free asset version
        run: sed -i 's/student-handsfree.js?v=20260816-conversation2/student-handsfree.js?v=20260816-conversation3/' index.html
      - name: Commit cachebust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Cachebust first-turn startup fix"
          git push origin HEAD:agent/fix-first-turn-startup
