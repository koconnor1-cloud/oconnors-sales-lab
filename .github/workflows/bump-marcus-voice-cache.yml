name: Bump Marcus Voice Cache
on:
  push:
    branches: [agent/cachebust-marcus-natural-voice]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cachebust-marcus-natural-voice
      - name: Bump direct hands-free asset version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='assets/student-handsfree.js?v=20260816-conversation1'
          new='assets/student-handsfree.js?v=20260816-conversation2'
          if old not in s:
              raise SystemExit('old hands-free asset version not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Cachebust restored Marcus voice"
          git push origin HEAD:agent/cachebust-marcus-natural-voice
