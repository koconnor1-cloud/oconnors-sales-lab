name: Wire Hands-Free Student Conversation

on:
  push:
    branches:
      - agent/fix-buyer-dialogue-tts

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-buyer-dialogue-tts
      - name: Wire versioned hands-free asset and smoke coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          old='<script src="assets/launch-evidence.js?v=20260816-analytics2"></script>'
          if old not in s:
              old='<script src="assets/launch-evidence.js"></script>'
          if old not in s:
              raise SystemExit('launch-evidence script tag not found')
          new=old+'\n<script src="assets/student-handsfree.js?v=20260816-conversation1"></script>'
          if 'assets/student-handsfree.js' not in s:
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tools/smoke-launch-readiness.mjs')
          s=p.read_text()
          old="    if(!hasScript('assets/teacher-class-analytics.js'))throw new Error(`${name}: teacher-class-analytics extension did not load`);"
          if old not in s:
              raise SystemExit('teacher analytics script smoke marker not found')
          new=old+"\n    if(!hasScript('assets/student-handsfree.js'))throw new Error(`${name}: student hands-free extension did not load`);"
          if 'student hands-free extension did not load' not in s:
              s=s.replace(old,new,1)

          marker="      analyticsSkillData:typeof window.analyticsSkillData,"
          if marker not in s:
              raise SystemExit('controls smoke marker not found')
          replacement=marker+"\n      toggleHandsFree:typeof window.toggleHandsFree,\n      enableHandsFree:typeof window.enableHandsFree,\n      disableHandsFree:typeof window.disableHandsFree,"
          if 'toggleHandsFree:typeof window.toggleHandsFree' not in s:
              s=s.replace(marker,replacement,1)

          oldlist="'renderTeacherClassAnalytics','analyticsSkillData'"
          newlist="'renderTeacherClassAnalytics','analyticsSkillData','toggleHandsFree','enableHandsFree','disableHandsFree'"
          if oldlist not in s:
              raise SystemExit('controls function list marker not found')
          s=s.replace(oldlist,newlist,1)

          marker="    if(analytics.minutesCold!=='15 min'||analytics.minutesZero!=='0 min')throw new Error(`${name}: practice-minute formatting is incorrect`);"
          if marker not in s:
              raise SystemExit('analytics smoke marker not found')
          test="""\n    const hf=await page.evaluate(()=>({\n      button:document.querySelector('#handsfree-toggle')?.textContent||'',\n      hasManualMic:typeof window.toggleMic==='function'\n    }));\n    if(!hf.button.includes('Hands-free'))throw new Error(`${name}: Hands-free control is missing`);\n    if(!hf.hasManualMic)throw new Error(`${name}: push-to-talk fallback is missing`);\n"""
          if 'Hands-free control is missing' not in s:
              s=s.replace(marker,marker+test,1)
          p.write_text(s)
          PY
      - name: Commit hands-free wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tools/smoke-launch-readiness.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Wire hands-free student conversation mode"
          git push origin HEAD:agent/fix-buyer-dialogue-tts
