name: Patch Realtime Handshake
on:
  push:
    branches:
      - agent/realtime-handshake-fallback
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/realtime-handshake-fallback
      - name: Bump semantic hands-free asset
        run: sed -i 's/student-handsfree.js?v=20260816-semantic1/student-handsfree.js?v=20260816-semantic2/' index.html
      - name: Commit cachebust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Cachebust Realtime handshake module"
          git push origin HEAD:agent/realtime-handshake-fallback
