name: Patch Opening VAD
on:
  push:
    branches:
      - agent/relax-opening-vad
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/relax-opening-vad
      - name: Relax first two substantive turns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/student-handsfree.js')
          s=p.read_text()
          s=s.replace("silenceMs:900,firstTurnWarmupMs:650", "silenceMs:900,openingSilenceMs:1600,firstTurnWarmupMs:650", 1)
          s=s.replace("function currentStudentTurnCount(){return APP.history.filter(x=>x.role==='user').length}\n", "function currentStudentTurnCount(){return APP.history.filter(x=>x.role==='user').length}\nfunction substantiveStudentTurnCount(){return APP.history.filter(x=>x.role==='user'&&!isMinimalConversationOpening(x.content)).length}\nfunction openingTurnProtectionActive(){return substantiveStudentTurnCount()<2}\n", 1)
          old="if(HANDSFREE.speechStarted&&now-HANDSFREE.lastVoiceAt>=HANDSFREE.silenceMs){const minVoiced=currentStudentTurnCount()===0?HANDSFREE.firstTurnMinVoicedMs:HANDSFREE.normalMinVoicedMs;"
          new="const silenceThreshold=openingTurnProtectionActive()?HANDSFREE.openingSilenceMs:HANDSFREE.silenceMs;if(HANDSFREE.speechStarted&&now-HANDSFREE.lastVoiceAt>=silenceThreshold){const minVoiced=openingTurnProtectionActive()?HANDSFREE.firstTurnMinVoicedMs:HANDSFREE.normalMinVoicedMs;"
          if old not in s: raise SystemExit('monitor anchor not found')
          s=s.replace(old,new,1)
          old="const firstTurn=currentStudentTurnCount()===0;HANDSFREE.chunks=[];"
          new="const firstTurn=currentStudentTurnCount()===0,openingProtected=openingTurnProtectionActive();HANDSFREE.chunks=[];"
          if old not in s: raise SystemExit('capture anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("handsFreeStatus(firstTurn?'Listening… take a moment, then begin':'Listening… speak naturally')", "handsFreeStatus(openingProtected?'Listening… take your time':'Listening… speak naturally')", 1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          old='assets/student-handsfree.js?v=20260816-conversation3'
          new='assets/student-handsfree.js?v=20260816-conversation4'
          if old not in s: raise SystemExit('conversation3 asset tag not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/student-handsfree.js index.html
          git commit -m "Relax first two substantive hands-free turns"
          git push origin HEAD:agent/relax-opening-vad
